<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La interfaz de Microsoft Word – Actividad interactiva</title>
<style>
:root{--azul:#134a8e;--azul2:#1f6fd1;--rojo:#c8344a;--fondo:#eef3fa;--tarjeta:#fff;--texto:#1b2433;--ok:#0b7a3b;--okbg:#e5f6ec;--mal:#b3261e;--malbg:#fdeaea;--borde:#c9d6e8}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:17px;line-height:1.4}
.app{max-width:1100px;margin:0 auto;padding:16px}
header.banner{background:linear-gradient(90deg,#0f3d78,#1a5aa8);color:#fff;border-radius:14px;padding:14px 22px;display:flex;align-items:center;gap:16px}
header.banner svg{flex:none;width:56px;height:56px}
header.banner h1{margin:0;font-size:clamp(1.3rem,3.6vw,2.2rem)}
.alumno{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0;background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:14px}
.alumno label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.alumno .campo{flex:1 1 260px}.alumno .campo.f{flex:0 1 200px}
input[type=text],input[type=date],select{width:100%;font:inherit;padding:9px 10px;border:2px solid var(--borde);border-radius:8px;background:#fff;color:var(--texto)}
input:focus,select:focus,button:focus-visible{outline:3px solid #ffb703;outline-offset:1px}
.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:12px}
.card img{width:100%;height:auto;display:block;border-radius:8px}
.card h2{margin:0 0 4px;font-size:1.15rem;color:#fff;background:var(--rojo);border-radius:10px;padding:8px 14px}
.hint{font-size:.9rem;margin:8px 2px 10px;color:#33415c}
.fila{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:8px;border-bottom:1px solid #e3eaf5;border-radius:8px;break-inside:avoid}
.fila .nom{font-weight:600}
.fila .sel{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fila.sinresp{background:#fff4d6;outline:2px solid #e0a800}
.fila.ok{background:var(--okbg)}.fila.mal{background:var(--malbg)}
.fb{grid-column:1/-1;font-size:.92rem;font-weight:600;display:none}
.fila.ok .fb{display:block;color:var(--ok)}.fila.mal .fb{display:block;color:var(--mal)}
.letra{background:#fff!important;width:84px!important;text-align:center;font-weight:700;font-size:1.1rem;text-transform:lowercase}
.pv{display:none}
.acciones{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin:16px 0}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;color:#fff}
#btnCalificar{background:var(--azul2)}#btnImprimir{background:#2b7a4b}#btnReintentar{background:#6b7280}
button:disabled{opacity:.5;cursor:not-allowed}
#msg{display:none;margin:0 0 12px;padding:12px 16px;border-radius:10px;background:#fff4d6;border:2px solid #e0a800;font-weight:600}
#resultado{display:none;background:var(--tarjeta);border:2px solid var(--azul);border-radius:14px;padding:16px;margin-top:14px;break-inside:avoid}
#resultado .nota{font-size:2.4rem;font-weight:800;color:var(--azul)}
#resultado .datos{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:6px;font-weight:600}
.print-head{display:none}
@media print{
 @page{size:Letter;margin:14mm}
 body{background:#fff;font-size:12pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .app{padding:0;max-width:none}
 .acciones,#msg,.alumno,.hint{display:none!important}
 .print-head{display:block;margin:8px 0;border:1px solid #888;border-radius:8px;padding:8px 12px;font-size:11pt}
 .layout{grid-template-columns:1fr 1fr;gap:10px}
 .card{border:1px solid #999}
 .card img{max-height:95mm;object-fit:contain}
 .letra{display:none!important}
 .pv{display:inline-block;font-weight:700;min-width:60px;border-bottom:1px solid #000}
 .fila{grid-template-columns:1fr 95px;padding:4px;break-inside:avoid}
 .sinresp{background:none!important;outline:none!important}
 #resultado{break-inside:avoid;page-break-inside:avoid}
 header.banner{break-inside:avoid}
}
</style>
</head>

<script>
"use strict";
/* ===== CLAVE DE RESPUESTAS (interna) =====
   Para cambiar una respuesta, edita la letra de "resp". */
const ELEMENTOS = [
 {nombre:"Reglas", resp:"a"},
 {nombre:"Fichas", resp:"b"},
 {nombre:"Barra de herramientas de acceso rápido", resp:"c"},
 {nombre:"Barra de título", resp:"d"},
 {nombre:"Botón Ayuda de Microsoft Word", resp:"e"},
 {nombre:"Botones de control", resp:"f"},
 {nombre:"Cinta de opciones", resp:"g"},
 {nombre:"Cursor", resp:"h"},
 {nombre:"Barra de desplazamiento vertical", resp:"i"},
 {nombre:"Zoom", resp:"j"},
 {nombre:"Apuntador o puntero del ratón", resp:"k"},
 {nombre:"Botones de vistas", resp:"l"},
 {nombre:"Barra de estado", resp:"m"}
];
const LETRAS = "abcdefghijklm".split("");

const $ = id => document.getElementById(id);
let calificado = false;
let orden = [];

/* Mezcla Fisher-Yates */
function mezclar(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function hoy(){const d=new Date();const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function fechaLegible(v){if(!v)return"";const [y,m,d]=v.split("-");return d+"/"+m+"/"+y;}

/* Normaliza lo escrito: "A", " a) " -> "a". Devuelve "" si no es una letra válida a–m */
function letraDe(inp){const v=inp.value.trim().toLowerCase().replace(/[)\.\s]/g,"");return LETRAS.includes(v)?v:"";}

/* Construye la lista de preguntas en orden aleatorio.
   Cada fila guarda su índice original, así la clave nunca se desvincula. */
function construir(){
 const cont=$("lista"); cont.innerHTML="";
 orden=mezclar(ELEMENTOS.map((_,i)=>i));
 orden.forEach((idx,pos)=>{
  const el=ELEMENTOS[idx];
  const fila=document.createElement("div");
  fila.className="fila"; fila.dataset.idx=idx;
  const sid="sel"+pos;
  fila.innerHTML='<label class="nom" for="'+sid+'">'+(pos+1)+'. '+el.nombre+'</label>'+
   '<div class="sel"><input type="text" class="letra" id="'+sid+'" maxlength="3" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="text" aria-label="Letra para '+el.nombre+'"><span class="pv" aria-hidden="true"></span></div><div class="fb"></div>';
  const sel=fila.querySelector("input.letra");
  sel.addEventListener("input",()=>{fila.classList.remove("sinresp");const v=letraDe(sel);fila.querySelector(".pv").textContent=v?v+")":sel.value.trim();});
  cont.appendChild(fila);
 });
}

function aviso(t){const m=$("msg");m.textContent=t;m.style.display=t?"block":"none";if(t)m.scrollIntoView({behavior:"smooth",block:"center"});}

function calificar(){
 if(calificado) return;               // evita clics repetidos
 aviso("");
 const faltan=[];
 if(!$("nombre").value.trim()) faltan.push("escribir tu nombre completo");
 if(!$("fecha").value) faltan.push("indicar la fecha");
 const filas=[...document.querySelectorAll(".fila")];
 const sinR=filas.filter(f=>!letraDe(f.querySelector("input.letra")));
 filas.forEach(f=>f.classList.toggle("sinresp",sinR.includes(f)));
 if(sinR.length) faltan.push("escribir una letra de la a) a la m) en "+(sinR.length===1?"1 elemento marcado":sinR.length+" elementos marcados")+" en amarillo");
 if(faltan.length){aviso("Antes de calificar debes: "+faltan.join("; ")+".");if(!$("nombre").value.trim())$("nombre").focus();return;}

 let ok=0;
 filas.forEach(f=>{
  const el=ELEMENTOS[+f.dataset.idx], sel=f.querySelector("input.letra"), fb=f.querySelector(".fb");
  const bien=letraDe(sel)===el.resp;
  if(bien)ok++;
  f.classList.add(bien?"ok":"mal"); sel.readOnly=true;
  fb.textContent=bien?"✔ Correcto":"✖ Incorrecto";  // en pantalla NO se muestra la respuesta correcta
 });
 const tot=filas.length, mal=tot-ok;
 const nota=Math.round((ok/tot)*10*100)/100;
 $("rNota").textContent=nota; $("rOk").textContent=ok; $("rMal").textContent=mal; $("rTot").textContent=tot;
 $("resultado").style.display="block";
 calificado=true;
 $("btnCalificar").disabled=true; $("nombre").readOnly=true; $("fecha").readOnly=true;
 $("btnReintentar").style.display="inline-block";
 $("resultado").focus();
}

function imprimir(){
 if(!calificado){aviso("Primero califica la actividad para que el PDF incluya una calificación válida.");return;}
 window.print();
}

function reintentar(){
 calificado=false; aviso("");
 $("resultado").style.display="none"; $("btnCalificar").disabled=false;
 $("nombre").readOnly=false; $("fecha").readOnly=false; $("btnReintentar").style.display="none";
 construir();
}

/* Datos del alumno para la versión impresa */
/* La respuesta correcta de las preguntas falladas se agrega solo para imprimir y se retira al terminar */
function textoFeedback(conRespuesta){
 document.querySelectorAll(".fila.mal").forEach(f=>{
  const el=ELEMENTOS[+f.dataset.idx];
  f.querySelector(".fb").textContent=conRespuesta?"✖ Incorrecto. Respuesta correcta: "+el.resp+")":"✖ Incorrecto";
 });
}
window.addEventListener("afterprint",()=>textoFeedback(false));
window.addEventListener("beforeprint",()=>{
 textoFeedback(calificado);
 $("printHead").innerHTML="<strong>Alumno:</strong> "+$("nombre").value.replace(/</g,"&lt;")+" &nbsp;&nbsp; <strong>Fecha:</strong> "+fechaLegible($("fecha").value)+
  " &nbsp;&nbsp; <strong>Actividad:</strong> La interfaz de Microsoft Word"+
  (calificado?" &nbsp;&nbsp; <strong>Calificación:</strong> "+$("rNota").textContent+"/10 ("+$("rOk").textContent+" aciertos, "+$("rMal").textContent+" errores, "+$("rTot").textContent+" preguntas)":"");
});
